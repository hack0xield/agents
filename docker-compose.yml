# Postgres for the orchestrator (spec §5.1).
services:
  db:
    image: postgres:16-alpine
    container_name: trading_assistant_db
    # Comes back after a reboot without anyone logging in. The app services are
    # systemd units; the database should not be the one thing left needing a
    # hand.
    restart: unless-stopped
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
      POSTGRES_DB: trading_assistant
    ports:
      - "127.0.0.1:5432:5432"   # loopback only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading_assistant"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
